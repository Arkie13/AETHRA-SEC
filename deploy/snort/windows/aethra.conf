# Minimal Snort 2.9 configuration for AETHRA-SEC on Windows.
#
# The stock Windows snort.conf ships with dozens of Linux paths and needs heavy
# editing before it will even validate. This file starts from nothing instead
# and turns on only what the alert-file ingest needs.
#
# Install it with:
#     copy /Y deploy\snort\windows\aethra.conf   C:\Snort\etc\
#     copy /Y deploy\snort\windows\local.rules   C:\Snort\rules\
#
# Validate it before running it for real:
#     C:\Snort\bin\snort.exe -c C:\Snort\etc\aethra.conf -T -i N
#
# Nothing here generates an alert. Snort observes real packets on a real
# interface; every alert AETHRA-SEC stores came from one.

# --------------------------------------------------------------------------
# Paths and network
# --------------------------------------------------------------------------
config logdir: C:\Snort\log

# Windows adapters commonly offload checksum calculation to the hardware, so
# the checksums Snort sees are placeholders rather than the real ones. Left on,
# Snort discards those packets as corrupt and alerts on nothing at all.
config checksum_mode: none

# Everything is in scope by default. Narrow HOME_NET to your own subnet (for
# example 192.168.1.0/24) once you move past the starter rules - it is what
# tells a rule set which side of a conversation is yours.
ipvar HOME_NET any
ipvar EXTERNAL_NET any

# --------------------------------------------------------------------------
# Dynamic modules
# --------------------------------------------------------------------------
# Folder names vary slightly between installers. If Snort reports it cannot
# find either of these, check what is actually under C:\Snort\lib and correct
# the path - or delete both lines, as nothing below depends on them.
dynamicpreprocessor directory C:\Snort\lib\snort_dynamicpreprocessor
dynamicengine C:\Snort\lib\snort_dynamicengine\sf_engine.dll

# --------------------------------------------------------------------------
# Preprocessors
# --------------------------------------------------------------------------
# Stream reassembly. Without it Snort judges each packet alone, which misses
# anything spread across a connection and makes flags: rules unreliable.
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp yes
preprocessor stream5_tcp: policy first
preprocessor stream5_udp
preprocessor stream5_icmp

# --------------------------------------------------------------------------
# Classifications and references
# --------------------------------------------------------------------------
# These ship with Snort. They give an alert its classtype and priority, which
# AETHRA-SEC reads and maps onto a severity - without them every alert arrives
# unclassified.
include C:\Snort\etc\classification.config
include C:\Snort\etc\reference.config

# --------------------------------------------------------------------------
# Output
# --------------------------------------------------------------------------
# alert_fast writes one line per alert to C:\Snort\log\alert.ids, which is the
# file AETHRA-SEC tails. This must match AETHRA_SNORT_ALERT_FILE in .env.
#
# Use alert_fast specifically: it is the format the ingest parser reads. Other
# output plugins will produce alerts Snort is happy with and AETHRA-SEC cannot
# interpret.
output alert_fast: alert.ids

# --------------------------------------------------------------------------
# Rules
# --------------------------------------------------------------------------
include C:\Snort\rules\local.rules
