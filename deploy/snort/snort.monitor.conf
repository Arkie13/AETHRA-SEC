# Snort 2.9 configuration for AETHRA-SEC in NETWORK MONITORING mode.
#
# Use this instead of snort.wsl.conf only when the capture point actually
# receives traffic between other machines - a managed switch mirror/SPAN
# destination port, or a network TAP. On an ordinary switched port it changes
# nothing, because the packets never arrive; see
# AETHRA-SEC_PORT_SCAN_NETWORK_VISIBILITY_AUDIT.md.
#
# What differs from snort.wsl.conf, and why
# -----------------------------------------
# snort.wsl.conf protects ONE host: HOME_NET is that host's /32 and every rule
# is "-> $HOME_NET", so only traffic aimed at this machine matches. That is
# correct for an endpoint sensor and it is why this machine's own outbound
# browsing is not reported as an attack on itself.
#
# It is also why a scan from 192.168.100.10 to 192.168.100.222 would not be
# reported even with perfect mirroring: the destination is not in HOME_NET, so
# no rule matches. Widening HOME_NET is therefore required in addition to
# fixing visibility - two separate blockers, and fixing either alone detects
# nothing.
#
# This file widens HOME_NET to the monitored segment. Read the trade-off
# before using it: the broad single-packet rules in local.rules (sid 1000001-
# 1000005) then match ordinary traffic between any two hosts on that segment,
# which on a busy network is a great deal of noise. For scan detection
# specifically, the sfportscan preprocessor below is what matters, and it is
# rate- and distinct-port-based rather than single-packet.

config logdir: /mnt/c/Snort-wsl/log
config checksum_mode: none

# The monitored segment, NOT this host. Copy home_net.monitor.conf.example to
# C:\Snort-wsl\home_net.monitor.conf and set it to the authorised laboratory
# range you are mirroring. It is deliberately a separate file from
# home_net.conf, which the Windows-side updater rewrites with this host's own
# address - pointing both at one file would have the updater silently narrow
# monitoring mode back to a single host.
include /mnt/c/Snort-wsl/home_net.monitor.conf

preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp yes
preprocessor stream5_tcp: policy first
preprocessor stream5_udp
preprocessor stream5_icmp

include /etc/snort/classification.config
include /etc/snort/reference.config

# Port-scan detection across the monitored segment.
#
# watch_ip is the whole monitored range here, so a scan from one lab host to
# another is in scope. GID 122, as in snort.wsl.conf:
#   122:1 TCP Portscan   122:3 TCP Portsweep   122:5 TCP Filtered Portscan
#
# sense_level medium is the deliberate choice: "low" needs a completed scan
# with negative responses and misses filtered hosts, "high" holds per-host
# statistical state and reports on single-host sweeps often enough to be
# noisy on a production segment. Medium catches a standard Nmap top-ports run
# without that. Raise or lower it against your own measured false-positive
# rate, not on a guess.
preprocessor sfportscan: proto { all } scan_type { all } sense_level { medium } watch_ip { $HOME_NET }

output alert_fast

include /mnt/c/xampp/htdocs/AETHRA-SECNEW/deploy/snort/local.rules
