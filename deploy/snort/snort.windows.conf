# Minimal Snort 2.9 configuration for AETHRA-SEC alert ingest on Windows.
# Alerts are written to a fast-alert text file that AETHRA-SEC tails
# (AETHRA_SNORT_TRANSPORT=file), since Windows has no Unix domain sockets.
config logdir: C:\Snort\log
config checksum_mode: none

# Decoder/preprocessor set kept small: this instance exists to detect on the
# local rule set below, not to run a full enterprise policy.
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp yes
preprocessor stream5_tcp: policy first
preprocessor stream5_udp
preprocessor stream5_icmp

include C:\Snort\etc\classification.config
include C:\Snort\etc\reference.config

# One alert per line, appended to the file AETHRA-SEC tails.
output alert_fast: alert.ids

include C:\Snort\etc\local.rules
