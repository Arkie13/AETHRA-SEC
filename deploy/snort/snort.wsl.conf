# Minimal Snort 2.9 configuration for AETHRA-SEC alert ingest, running Snort
# inside WSL (Ubuntu 22.04) while AETHRA-SEC itself runs natively on Windows.
#
# Snort writes alert_fast output under C:\Snort-wsl\log, which is the same
# directory on both sides (Windows sees it at C:\Snort-wsl\log, WSL sees it
# at /mnt/c/Snort-wsl/log) - this avoids relying on a Unix domain socket,
# which cannot be dialled across the WSL2 VM boundary from a native Windows
# process.
#
# This is a copy of the config validated in the sibling AETHRA-SEC project's
# deploy/snort/snort.wsl.conf, referencing this project's own local.rules.
# The live pcap-capture pipeline (tshark on Windows + this Snort in WSL) is
# a single shared instance monitoring the real host - see deploy/snort/README.md.
config logdir: /mnt/c/Snort-wsl/log
config checksum_mode: none

# The one host this sensor protects. Rules below alert on traffic *to*
# $HOME_NET (someone else reaching this machine), never traffic *from* it -
# without this, this host's own ordinary outbound browsing/app traffic
# matches the same broad rules and gets misread as an attack against it.
# Kept current automatically: C:\Snort-wsl\update_home_net.ps1 runs in the
# background on the Windows side and rewrites home_net.conf whenever this
# host's real LAN IP changes (DHCP renewal, different network) - Snort
# re-reads this config fresh on every capture chunk, so the change takes
# effect within seconds, no restart needed.
include /mnt/c/Snort-wsl/home_net.conf

preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp yes
preprocessor stream5_tcp: policy first
preprocessor stream5_udp
preprocessor stream5_icmp

# Ubuntu's snort-common package already installs these.
include /etc/snort/classification.config
include /etc/snort/reference.config

# No filename given: this Snort build has been observed to inconsistently
# honour an explicit "output alert_fast: <name>" filename (falls back to its
# own hardcoded default, "alert", unpredictably often) - using the bare form
# makes the output filename deterministic instead of fighting that.
output alert_fast

include /mnt/c/xampp/htdocs/AETHRA-SECNEW/deploy/snort/local.rules
